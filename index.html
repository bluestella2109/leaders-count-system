<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>FESTIVAL SCORE SYSTEM</title>

  <link rel="stylesheet" href="css/style.css">
</head>


<body>

  <!-- ========================================
       BACKGROUND
  ========================================= -->

  <div class="noise"></div>

  <div
    id="codeRain"
    class="code-rain"
    aria-hidden="true"
  ></div>


  <!-- ========================================
       TOP HEADER
  ========================================= -->

  <header class="top-header">

    <div class="system-name">
      FESTIVAL SCORE SYSTEM
    </div>

    <div class="system-status">

      <span class="status-dot"></span>

      SYSTEM ONLINE

    </div>

  </header>


  <!-- ========================================
       MAIN
  ========================================= -->

  <main class="home">

    <section class="terminal-card">

      <!-- small label -->

      <div class="terminal-label">

        <span>
          CULTURE FESTIVAL
        </span>

        <span>
          //
        </span>

        <span>
          TERMINAL 01
        </span>

      </div>


      <!-- title -->

      <div
        class="glitch-title"
        data-text="SCORE"
      >
        SCORE
      </div>


      <div
        class="glitch-title second"
        data-text="SYSTEM"
      >
        SYSTEM
      </div>


      <!-- description -->

      <p class="home-description">

        操作を選択してください

      </p>


      <!-- buttons -->

      <div class="home-buttons">

        <button
          class="main-button"
          onclick="location.href='input.html'"
        >

          <span class="button-main">
            点数を入力する
          </span>

          <span class="button-sub">
            ENTER SCORE
          </span>

        </button>


        <button
          class="main-button"
          onclick="location.href='list.html'"
        >

          <span class="button-main">
            点数一覧を見る
          </span>

          <span class="button-sub">
            SCORE DATABASE
          </span>

        </button>

      </div>


      <!-- bottom information -->

      <div class="terminal-footer">

        <span>
          SYSTEM://READY
        </span>

        <span>
          2026
        </span>

      </div>

    </section>

  </main>


  <!-- ========================================
       JS
  ========================================= -->

  <script type="module" src="js/codeRain.js"></script>

</body>

</html>
