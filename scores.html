<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <title>SCORE LIST // FESTIVAL</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body class="list-page">


  <!-- ======================================
       BACKGROUND
  ======================================= -->

  <div
    id="codeRain"
    class="code-rain"
    aria-hidden="true"
  ></div>

  <div
    class="scanlines"
    aria-hidden="true"
  ></div>

  <div
    class="noise"
    aria-hidden="true"
  ></div>


  <!-- ======================================
       MAIN
  ======================================= -->

  <main class="list-container">


    <!-- ====================================
         HEADER
    ===================================== -->

    <header class="list-header">


      <div class="list-header-title">

        <div class="system-label">
          SYS:// SCORE_DATABASE
        </div>

        <h1
          class="glitch-title list-title"
          data-text="SCORE LIST"
        >
          SCORE LIST
        </h1>

        <p class="list-subtitle">
          FESTIVAL SCORE DATABASE
        </p>

      </div>


      <div class="header-actions">


        <!-- 入力画面 -->

        <a
          href="index.html"
          class="header-list-button"
        >
          ＋ SCORE
        </a>


      </div>

    </header>


    <!-- ======================================
         DATABASE STATUS
    ======================================= -->

    <section class="database-info">


      <div class="database-stat">

        <span class="stat-label">
          ENTRIES
        </span>

        <strong
          id="entryCount"
          class="stat-number"
        >
          0
        </strong>

      </div>


      <div class="database-stat">

        <span class="stat-label">
          WAITING
        </span>

        <strong
          id="waitingCount"
          class="stat-number"
        >
          0
        </strong>

      </div>


      <div class="database-stat">

        <span class="stat-label">
          COMPLETE
        </span>

        <strong
          id="completeCount"
          class="stat-number"
        >
          0
        </strong>

      </div>


    </section>


    <!-- ======================================
         SORT SWITCH
    ======================================= -->

    <section class="sort-area">


      <div class="sort-switch">


        <button
          id="newestButton"
          class="sort-button active"
          type="button"
        >

          <span class="sort-main">
            NEWEST
          </span>

          <span class="sort-sub">
            新着順
          </span>

        </button>


        <button
          id="rankingButton"
          class="sort-button"
          type="button"
        >

          <span class="sort-main">
            RANKING
          </span>

          <span class="sort-sub">
            ランキング
          </span>

        </button>


      </div>


      <div
        id="sortModeText"
        class="sort-mode-text"
      >
        SORT : NEWEST
      </div>


    </section>


    <!-- ======================================
         TABLE
    ======================================= -->

    <section class="score-table-area">


      <!-- 横スクロール用 -->

      <div class="score-table-scroll">


        <!-- ==================================
             TABLE HEADER
        =================================== -->

        <div class="score-table-header">


          <div class="column-rank">
            RANK
          </div>


          <div class="column-player">
            PLAYER
          </div>


          <div class="column-date">
            REGISTERED
          </div>


          <div class="column-quiz">
            QUIZ
          </div>


          <div class="column-shooting">
            SHOOTING
          </div>


          <div class="column-total">
            TOTAL
          </div>


          <div class="column-status">
            STATUS
          </div>


          <div class="column-action">
            ACTION
          </div>


        </div>


        <!-- ==================================
             SCORE LIST
        =================================== -->

        <div
          id="scoreList"
          class="score-list"
        ></div>


      </div>


      <!-- ==================================
           EMPTY
      =================================== -->

      <div
        id="emptyMessage"
        class="empty-message hidden"
      >

        <div class="empty-code">
          // DATABASE EMPTY
        </div>

        <div class="empty-title">
          NO DATA
        </div>

        <div class="empty-text">
          SCORE DATA NOT FOUND
        </div>

      </div>


    </section>


    <!-- ======================================
         RESET
    ======================================= -->

    <section class="admin-area">


      <div class="admin-warning">

        <span class="warning-mark">
          !
        </span>

        <div>

          <strong>
            ADMIN AREA
          </strong>

          <p>
            全データを削除すると元に戻せません。
          </p>

        </div>

      </div>


      <button
        id="resetAllButton"
        class="reset-button"
        type="button"
      >

        <span>
          RESET ALL DATA
        </span>

        <small>
          全データ初期化
        </small>

      </button>


    </section>


    <!-- ======================================
         FOOTER
    ======================================= -->

    <footer class="list-footer">

      <span>
        FESTIVAL // SCORE SYSTEM
      </span>

      <span>
        DATABASE ONLINE
      </span>

    </footer>


  </main>


  <!-- ======================================
       JAVASCRIPT
  ======================================= -->

  <script
    type="module"
    src="js/scores.js"
  ></script>


</body>

</html>
